[project]
name = "crime_automata"
authors = [{name = "Yuanming Song", email = "yuanming.song@inf.ethz.ch"}]
description = "A framework for pefroming compression side-channel attacks using CRIME automata"
version = "0.1.0"
dependencies = ["crc32c"]
requires-python = ">=3.10"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/crime_automata",
]
